<!-- TeacherDashboardSubjectTab -->
<dashboard-teacher-tab current-tab="'mySubjects'"></dashboard-teacher-tab>
<div data-ng-controller="TeacherDashboardSubjectTabController as teacherDashboardSubjectTabController">
    <!-- Parcours : entrée dédiée (pas d'onglet du dashboard-teacher-tab partagé, cf. rapport de tâche) -->
    <div class="row right-magnet mb-16">
        <a class="button button-secondary" href="#/subject-sequence/list">
            <svg class="icon-list" width="18" height="18"><use href="exercizer/public/assets/icons/icons.svg#list"></use></svg>
            <i18n>exercizer.sequence.dashboard.title</i18n>
        </a>
    </div>
    <!-- page -->
    <teacher-dashboard-subject-list></teacher-dashboard-subject-list>
    <!-- lightBox -->
    <teacher-dashboard-toaster></teacher-dashboard-toaster>
    <teacher-dashboard-remove-selected-folder-and-subject></teacher-dashboard-remove-selected-folder-and-subject>
    <teacher-dashboard-folder-edit></teacher-dashboard-folder-edit>
    <teacher-dashboard-subject-edit></teacher-dashboard-subject-edit>
    <teacher-dashboard-copy-paste></teacher-dashboard-copy-paste>
    <teacher-dashboard-move></teacher-dashboard-move>
    <teacher-dashboard-print></teacher-dashboard-print>
    <teacher-dashboard-subject-export></teacher-dashboard-subject-export>
    <teacher-dashboard-publish-to-library></teacher-dashboard-publish-to-library>
    <subject-schedule></subject-schedule>
    <share-panel-modal></share-panel-modal>
</div>
