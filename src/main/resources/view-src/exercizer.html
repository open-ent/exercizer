<!DOCTYPE html>
<html>

<head>
	<title>{{#i18n}}exercizer.title{{/i18n}}</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

	<script src="/assets/js/entcore/ng-app.js?v=@@VERSION" id="context" type="text/javascript"></script>
	<script type="text/javascript" src="/exercizer/public/dist/application.js?v=@@VERSION"></script>
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
	@media print {
		@page {
		margin: 1.5cm;
		}
	}
	@supports (-webkit-overflow-scrolling: touch) {
		html {
			overflow: hidden;
			height: 100%;
			position: fixed;
		}
		body {
			overflow: auto;
			height: 100%;
			position: relative;
		}
	}
	.alertchange .loading{
		font-size: 450%;
	}
	.alertchange .close-lightbox{
		display: none;
	}

	/*
	  Bandeau d'invitation à la nouvelle IHM React. Styles posés ici, dans la vue de l'ancienne
	  IHM, pour n'avoir rien à retirer d'ailleurs le jour où elle disparaît.
	  Teintes neutres assumées : la feuille de cette IHM n'expose pas les jetons `--openent-*`
	  du socle, et deviner les siens donnerait un rendu faux sur certains thèmes.
	*/
	.exercizer-ui-switch {
		position: fixed;
		left: 50%;
		bottom: 16px;
		transform: translateX(-50%);
		z-index: 9000;
		max-width: calc(100vw - 32px);
		display: flex;
		align-items: center;
		gap: 24px;
		padding: 12px 16px;
		border-radius: 8px;
		background: #243242;
		color: #fff;
		box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
		font-size: 14px;
	}
	.exercizer-ui-switch[hidden] { display: none; }
	.exercizer-ui-switch-text { display: flex; flex-direction: column; gap: 2px; }
	.exercizer-ui-switch-text span { opacity: .8; }
	.exercizer-ui-switch-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
	.exercizer-ui-switch-actions button {
		border: 0;
		border-radius: 6px;
		padding: 8px 14px;
		font-size: 14px;
		cursor: pointer;
		background: transparent;
		color: #fff;
		text-decoration: underline;
	}
	.exercizer-ui-switch-actions button.primary {
		background: #fff;
		color: #243242;
		font-weight: 600;
		text-decoration: none;
	}
	@media (max-width: 600px) {
		.exercizer-ui-switch { flex-direction: column; align-items: stretch; gap: 12px; }
	}
	</style>
</head>

<body class="exercizer" library-root data-overflow="auto">
	<div data-ng-controller="ExercizerController">
		<portal data-ng-if="!isPrintPage">
			<span class="zero-desktop">
				<div class="row">
					<app-title class="twelve">
						<h1 class="cell right-spacing-twice" data-ng-click="redirectToDashBoard()" help-box-step="workspace.help.1" help-box-step-priority="-1">
							<i class="storage"></i><i18n class="storage">exercizer.title.short</i18n>
						</h1>
					</app-title>
				</div>
				<subject-copy-mobile-left-nav data-current-grain-copy="currentGrainCopy"
				                              data-grain-copy-list="grainCopyList"
				                              data-grain-copy-change="mobileLeftNavChange(grainCopy)">
				</subject-copy-mobile-left-nav>
			</span>
			<container template="main"></container>
		</portal>
		<!-- No portal for printing -->
		<div data-ng-if="isPrintPage">
			<portal-styles></portal-styles>
			<container template="main"></container>
		</div>
	</div>
	<library-publish></library-publish>

	<!--
	  Invitation à essayer la nouvelle IHM React. Rendue ici en HTML plutôt que construite en
	  JavaScript : les libellés passent par la balise i18n du gabarit, dans un contexte HTML — le
	  seul que le moteur de gabarit échappe correctement (les textes français portent des
	  apostrophes). Hors du <portal> et en position fixe : aucune interaction avec la mise en page
	  AngularJS. Masquée par défaut ; c'est ui-switch.js qui décide de l'afficher, d'après la
	  préférence usager.
	-->
	<div id="exercizer-ui-switch" class="exercizer-ui-switch" hidden>
		<div class="exercizer-ui-switch-text">
			<strong>{{#i18n}}exercizer.switch.invitation.title{{/i18n}}</strong>
			<span>{{#i18n}}exercizer.switch.invitation.body{{/i18n}}</span>
		</div>
		<div class="exercizer-ui-switch-actions">
			<button type="button" data-action="later">{{#i18n}}exercizer.switch.invitation.later{{/i18n}}</button>
			<button type="button" data-action="try" class="primary">{{#i18n}}exercizer.switch.invitation.try{{/i18n}}</button>
		</div>
	</div>
	<script type="text/javascript" src="/exercizer/public/ui-switch.js?v=@@VERSION"></script>
</body>

</html>
